interface:
  display_name: "Plan panel loop"
  short_description: "Patch and re-review plans through an adversarial loop"
  default_prompt: "Use $plan-panel-loop on this plan. Resolve the target, authority, mutation boundary, loop cap, and proof boundary first. Run a read-only adversarial panel, consolidate supported findings, patch only the named plan artifact or return a patch-shaped replacement, then re-review carried-forward findings. Stop when the inspected scope is defensible, a user decision is needed, the iteration cap is reached, or the plan is not patchable as given."
